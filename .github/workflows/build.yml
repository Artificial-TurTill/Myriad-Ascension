name: Build

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build both mods and run unit tests (includes content validation)
        run: ./gradlew --no-daemon build

      - name: In-game tests (headless server, both mods)
        run: ./gradlew --no-daemon :myriad-realm:runGameTestServer -PgameTests

      - name: Package the Obsidian vault
        run: |
          mkdir -p build/vault
          cp -r vault "build/vault/Myriad Ascension Vault"
          cd build/vault && zip -qr ../Myriad-Ascension-Vault.zip "Myriad Ascension Vault"

      - name: Upload jars, vault and test reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: myriad-ascension-0.1.1-dev
          path: |
            foundation/build/libs/*.jar
            myriad-realm/build/libs/*.jar
            build/Myriad-Ascension-Vault.zip
            foundation/build/reports/tests/test/
            myriad-realm/build/reports/tests/test/
          if-no-files-found: error
          retention-days: 30
