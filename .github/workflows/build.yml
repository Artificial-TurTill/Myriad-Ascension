name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate PNG assets
        run: python3 scripts/validate_pngs.py

      - name: Build
        run: ./gradlew build

      - name: Upload alpha JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Myriad-Ascension-0.1.0-alpha.14
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
