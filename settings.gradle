pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Myriad-Ascension'

// Two mods, two jars: the Foundation (engine) and Myriad Realm (add-on that requires the Foundation).
include 'foundation'
include 'myriad-realm'
